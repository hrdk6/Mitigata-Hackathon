# Declarative checks (bonus B-4): add or change a check here, no code required.
# Each check: where it applies (surface/when), how to probe (Suspected), and how
# to verify (Confirmed). The engine maps each probe/verify `type` to a safe,
# non-destructive handler.
checks:
  - id: web-default-credentials
    surface: web
    ptes_phase: exploitation
    when: {service: http}
    probe:
      type: http_login
      paths: ["/login"]
      username_field: username
      password_field: password
      credentials:
        - ["admin", "admin"]
        - ["admin", "password"]
        - ["admin", "admin123"]
        - ["administrator", "admin"]
        - ["root", "root"]
        - ["root", "toor"]
        - ["test", "test"]
        - ["guest", "guest"]
        - ["user", "user"]
      fail_contains: "Invalid"
    verify:
      type: http_login
      authed_path: "/admin"
    severity: high
    fix: "Remove default accounts; enforce a strong password policy and account lockout."

  - id: web-git-exposure
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: http_git_exposure, path: "/.git/config"}
    verify: {type: http_git_exposure}
    severity: medium
    fix: "Block access to .git over HTTP; never deploy the VCS directory to the web root."

  - id: web-reflected-input
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: http_reflected_input, paths: ["/search"], param: q}
    verify: {type: http_reflected_input}
    severity: medium
    fix: "Apply context-aware output encoding to user-controlled values; add a Content-Security-Policy."

  - id: web-sensitive-paths
    surface: web
    ptes_phase: intelligence_gathering
    when: {service: http}
    probe:
      type: http_paths
      paths:
        - "/admin"
        - "/backup"
        - "/backup.zip"
        - "/robots.txt"
        - "/.env"
        - "/.git/HEAD"
        - "/config.php.bak"
        - "/server-status"
        - "/phpinfo.php"
        - "/.htaccess"
        - "/swagger.json"
        - "/actuator/health"
        - "/debug"
        - "/index.php"
        - "/index.php?p="
        - "/index.php?p=ops"
        - "/index.php?p=backups"
        - "/vault"
        - "/vault/"
        - "/wiki"
        - "/wiki/infra"
        - "/wiki/zone"
      expect_status: [200, 401, 403]
      severity: low
    verify: {type: http_status, expect_status: [200, 401, 403]}
    severity: low
    fix: "Restrict access, require authentication, or remove the endpoint if it is not meant to be public."

  - id: web-ip-spoofing-bypass
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe:
      type: http_header_bypass
      headers:
        - {"X-Forwarded-For": "192.168.60.1"}
        - {"X-Forwarded-For": "127.0.0.1"}
        - {"X-Real-IP": "127.0.0.1"}
    verify: {type: http_header_bypass}
    severity: high
    fix: "Do not trust client-supplied X-Forwarded-For headers from untrusted networks; configure reverse proxy to strip forwarding headers."

  - id: web-server-banner
    surface: web
    ptes_phase: intelligence_gathering
    when: {service: http}
    probe: {type: http_header_disclosure, path: "/"}
    verify: {type: http_header_present}
    severity: low
    fix: "Suppress or genericise the Server/X-Powered-By headers to avoid version fingerprinting."

  - id: web-info-disclosure
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: http_info_disclosure}
    verify: {type: http_info_disclosure}
    severity: low
    fix: "Disable debug/verbose errors in production; never expose absolute server file paths."

  - id: web-sql-injection
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: sql_injection, param: id}
    verify: {type: sql_injection}
    severity: high
    fix: "Use parameterised queries / prepared statements; run the DB account with least privilege."

  - id: web-path-traversal
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: path_traversal, param: file}
    verify: {type: path_traversal}
    severity: high
    fix: "Canonicalise and allow-list file paths; keep user input out of filesystem APIs."

  - id: web-directory-listing
    surface: web
    ptes_phase: intelligence_gathering
    when: {service: http}
    probe:
      type: directory_listing
      paths: ["/", "/index.php", "/index.php?p=", "/ops/", "/backups/", "/vault/", "/images/", "/uploads/", "/files/", "/static/", "/backup/", "/assets/"]
    verify: {type: directory_listing}
    severity: low
    fix: "Disable automatic directory indexing on the web server."

  - id: web-security-headers
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: http_security_headers}
    verify: {type: http_security_headers}
    severity: low
    fix: "Set Content-Security-Policy, X-Frame-Options, X-Content-Type-Options, and HSTS (over TLS)."

  - id: web-insecure-cookies
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: http_insecure_cookies}
    verify: {type: http_insecure_cookies}
    severity: low
    fix: "Set HttpOnly and SameSite on session cookies (and Secure over TLS)."

  - id: web-cors-misconfig
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: http_cors}
    verify: {type: http_cors}
    severity: high
    fix: "Validate Origin against an allow-list; never reflect arbitrary origins with credentials."

  - id: web-http-methods
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: http_methods}
    verify: {type: http_methods}
    severity: medium
    fix: "Disable TRACE/TRACK and any write methods (PUT/DELETE) not required by the application."

  - id: web-open-redirect
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: http_open_redirect}
    verify: {type: http_open_redirect}
    severity: medium
    fix: "Allow-list redirect targets; never place user-controlled values directly in Location."

  - id: web-backup-files
    surface: web
    ptes_phase: intelligence_gathering
    when: {service: http}
    probe: {type: http_backup_files}
    verify: {type: http_backup_files}
    severity: medium
    fix: "Remove backup/secret files from the web root and block access to dotfiles."

  - id: bin-weak-strings
    surface: binary
    ptes_phase: vulnerability_analysis
    probe:
      type: binary_strings
      credentials:
        - "(?i)pass(word|wd)?\\s*[:=]\\s*\\S+"
        - "(?i)secret\\s*[:=]\\s*\\S+"
        - "(?i)api[_-]?key\\s*[:=]\\s*\\S+"
        - "(?i)token\\s*[:=]\\s*\\S+"
        - "AKIA[0-9A-Z]{16}"
        - "-----BEGIN (?:RSA|OPENSSH|EC|DSA|PRIVATE) ?KEY-----"
        - "(?i)(?:mysql|postgres|mongodb)://\\S+:\\S+@\\S+"
      unsafe_functions: ["gets", "strcpy", "strcat", "sprintf", "vsprintf", "system", "popen", "exec", "scanf", "memcpy"]
    verify: {type: binary_strings}
    severity: high
    fix: "Remove embedded secrets; replace unsafe functions with bounded-length safe equivalents."

  - id: bin-checksec
    surface: binary
    ptes_phase: vulnerability_analysis
    probe: {type: binary_checksec}
    verify: {type: binary_checksec}
    severity: medium
    fix: "Compile with -fstack-protector-strong, -fPIE -pie, full RELRO and a non-executable stack."

  # -- network-service checks (any open port on an in-scope host) ------------
  - id: net-vulnerable-version
    surface: network
    ptes_phase: vulnerability_analysis
    probe: {type: net_version}       # no `when`: fingerprints every open port
    verify: {type: net_version}
    severity: high
    fix: "Upgrade the affected service to a patched release."

  - id: net-redis-unauth
    surface: network
    ptes_phase: vulnerability_analysis
    when: {service: redis}
    probe: {type: net_unauth}
    verify: {type: net_unauth}
    severity: high
    fix: "Require AUTH, enable protected-mode, and bind Redis to localhost / a trusted interface."

  - id: net-memcached-unauth
    surface: network
    ptes_phase: vulnerability_analysis
    when: {service: memcached}
    probe: {type: net_unauth}
    verify: {type: net_unauth}
    severity: medium
    fix: "Enable SASL, disable UDP, and bind memcached to localhost / a trusted interface."

  - id: net-elasticsearch-open
    surface: network
    ptes_phase: vulnerability_analysis
    when: {service: elasticsearch}
    probe: {type: net_unauth}
    verify: {type: net_unauth}
    severity: high
    fix: "Enable the security realm (authentication + TLS) and restrict network access."

  - id: net-ftp-anonymous
    surface: network
    ptes_phase: vulnerability_analysis
    when: {service: ftp}
    probe: {type: net_unauth}
    verify: {type: net_unauth}
    severity: medium
    fix: "Disable the anonymous account unless a public read-only area is explicitly intended."

  - id: net-telnet-cleartext
    surface: network
    ptes_phase: vulnerability_analysis
    when: {service: telnet}
    probe: {type: net_unauth}
    verify: {type: net_unauth}
    severity: medium
    fix: "Disable Telnet and use SSH instead."

  - id: net-database-exposed
    surface: network
    ptes_phase: vulnerability_analysis
    probe: {type: net_unauth, services: [mysql, postgres, mssql, mongodb]}
    verify: {type: net_unauth}
    severity: medium
    fix: "Bind the database to localhost / a private interface and firewall the port."

  - id: net-smb
    surface: network
    ptes_phase: vulnerability_analysis
    when: {service: smb}             # SMBv1 still enabled; message signing not required
    probe: {type: net_unauth}
    verify: {type: net_unauth}
    severity: high
    fix: "Disable SMBv1 and require SMB signing on servers and clients."

  - id: net-snmp-default
    surface: network
    ptes_phase: vulnerability_analysis
    when: {service: snmp}            # UDP/161 — recon runs it once per host
    probe: {type: net_snmp}
    verify: {type: net_unauth}
    severity: medium
    fix: "Remove default SNMP communities; use SNMPv3 with authentication and restrict SNMP by ACL."

  - id: net-tls-certificate
    surface: network
    ptes_phase: vulnerability_analysis
    when: {tls: true}
    probe: {type: tls_audit}
    verify: {type: tls_audit}
    severity: low
    fix: "Install a valid CA-signed certificate and disable obsolete TLS versions (SSLv3/TLS1.0/1.1)."
