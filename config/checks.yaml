# Declarative checks (bonus B-4): add or change a check here, no code required.
# Each check: where it applies (surface/when), how to probe (Suspected), and how
# to verify (Confirmed). The engine maps each probe/verify `type` to a safe,
# non-destructive handler.
checks:
  - id: web-default-credentials
    surface: web
    ptes_phase: exploitation
    when: {service: http}
    probe:
      type: http_login
      paths: ["/login"]
      username_field: username
      password_field: password
      credentials:
        - ["admin", "admin"]
        - ["admin", "password"]
        - ["admin", "admin123"]
        - ["administrator", "admin"]
        - ["root", "root"]
        - ["root", "toor"]
        - ["test", "test"]
        - ["guest", "guest"]
        - ["user", "user"]
      fail_contains: "Invalid"
    verify:
      type: http_login
      authed_path: "/admin"
    severity: high
    fix: "Remove default accounts; enforce a strong password policy and account lockout."

  - id: web-git-exposure
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: http_git_exposure, path: "/.git/config"}
    verify: {type: http_git_exposure}
    severity: medium
    fix: "Block access to .git over HTTP; never deploy the VCS directory to the web root."

  - id: web-reflected-input
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: http_reflected_input, paths: ["/search"], param: q}
    verify: {type: http_reflected_input}
    severity: medium
    fix: "Apply context-aware output encoding to user-controlled values; add a Content-Security-Policy."

  - id: web-sensitive-paths
    surface: web
    ptes_phase: intelligence_gathering
    when: {service: http}
    probe:
      type: http_paths
      paths:
        - "/admin"
        - "/backup"
        - "/backup.zip"
        - "/robots.txt"
        - "/.env"
        - "/.git/HEAD"
        - "/config.php.bak"
        - "/server-status"
        - "/phpinfo.php"
        - "/.htaccess"
        - "/swagger.json"
        - "/actuator/health"
        - "/debug"
        - "/index.php"
        - "/index.php?p="
        - "/index.php?p=ops"
        - "/index.php?p=backups"
        - "/vault"
        - "/vault/"
        - "/wiki"
        - "/wiki/infra"
        - "/wiki/zone"
      expect_status: [200, 401, 403]
      severity: low
    verify: {type: http_status, expect_status: [200, 401, 403]}
    severity: low
    fix: "Restrict access, require authentication, or remove the endpoint if it is not meant to be public."

  - id: web-ip-spoofing-bypass
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe:
      type: http_header_bypass
      headers:
        - {"X-Forwarded-For": "192.168.60.1"}
        - {"X-Forwarded-For": "127.0.0.1"}
        - {"X-Real-IP": "127.0.0.1"}
    verify: {type: http_header_bypass}
    severity: high
    fix: "Do not trust client-supplied X-Forwarded-For headers from untrusted networks; configure reverse proxy to strip forwarding headers."

  - id: web-server-banner
    surface: web
    ptes_phase: intelligence_gathering
    when: {service: http}
    probe: {type: http_header_disclosure, path: "/"}
    verify: {type: http_header_present}
    severity: low
    fix: "Suppress or genericise the Server header to avoid version fingerprinting."

  - id: web-sql-injection
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: sql_injection, param: id}
    verify: {type: sql_injection}
    severity: high
    fix: "Use parameterised queries / prepared statements; run the DB account with least privilege."

  - id: web-path-traversal
    surface: web
    ptes_phase: vulnerability_analysis
    when: {service: http}
    probe: {type: path_traversal, param: file}
    verify: {type: path_traversal}
    severity: high
    fix: "Canonicalise and allow-list file paths; keep user input out of filesystem APIs."

  - id: web-directory-listing
    surface: web
    ptes_phase: intelligence_gathering
    when: {service: http}
    probe:
      type: directory_listing
      paths: ["/", "/index.php", "/index.php?p=", "/ops/", "/backups/", "/vault/", "/images/", "/uploads/", "/files/", "/static/", "/backup/", "/assets/"]
    verify: {type: directory_listing}
    severity: low
    fix: "Disable automatic directory indexing on the web server."

  - id: bin-weak-strings
    surface: binary
    ptes_phase: vulnerability_analysis
    probe:
      type: binary_strings
      credentials:
        - "(?i)pass(word|wd)?\\s*[:=]\\s*\\S+"
        - "(?i)secret\\s*[:=]\\s*\\S+"
        - "(?i)api[_-]?key\\s*[:=]\\s*\\S+"
        - "(?i)token\\s*[:=]\\s*\\S+"
        - "AKIA[0-9A-Z]{16}"
        - "-----BEGIN (?:RSA|OPENSSH|EC|DSA|PRIVATE) ?KEY-----"
        - "(?i)(?:mysql|postgres|mongodb)://\\S+:\\S+@\\S+"
      unsafe_functions: ["gets", "strcpy", "strcat", "sprintf", "vsprintf", "system", "popen", "exec", "scanf", "memcpy"]
    verify: {type: binary_strings}
    severity: high
    fix: "Remove embedded secrets; replace unsafe functions with bounded-length safe equivalents."

  - id: bin-checksec
    surface: binary
    ptes_phase: vulnerability_analysis
    probe: {type: binary_checksec}
    verify: {type: binary_checksec}
    severity: medium
    fix: "Compile with -fstack-protector-strong, -fPIE -pie, full RELRO and a non-executable stack."
