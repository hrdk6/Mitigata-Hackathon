<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NightTrace — live</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--mut:#8b949e;--accent:#7E56C2;
        --high:#f85149;--med:#e3853d;--low:#d9b00a;--ok:#3fb950}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:20px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .mut{color:var(--mut)}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .panel h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;grid-column:1/3}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .tile b{display:block;font-size:26px}
  .tile.ok b{color:var(--ok)} .tile.hi b{color:var(--high)}
  .feed{height:320px;overflow:auto;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
  .ev{padding:3px 0;border-bottom:1px solid #21262d}
  .ag{display:inline-block;min-width:78px;color:var(--accent);font-weight:700}
  .warn{color:var(--med)} .err{color:var(--high)}
  .f{padding:8px 10px;margin:6px 0;border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:6px}
  .f.high,.f.critical{border-left-color:var(--high)} .f.medium{border-left-color:var(--med)} .f.low{border-left-color:var(--low)}
  .f .t{font-weight:600} .f .m{font-size:12px;color:var(--mut)}
  .badge{font-size:11px;padding:1px 6px;border-radius:4px;background:#21262d;color:var(--fg)}
  .chain{font:13px/1.8 ui-monospace,monospace}
  .chain .node{background:#21262d;border:1px solid var(--line);border-radius:5px;padding:2px 7px}
  .chain .flag{background:var(--accent);color:#fff}
  .hyp{padding:8px 10px;margin:6px 0;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px}
  .hyp.val{border-left-color:var(--ok)}
  .hyp .t{font-weight:600}
  .hyp .m{font-size:12px;color:var(--mut);margin-top:2px}
  .hyp .st{font-size:10.5px;padding:1px 6px;border-radius:4px;background:#21262d;color:var(--mut);float:right}
  .hyp.val .st{background:var(--ok);color:#06240f;font-weight:700}
  .phases{display:flex;flex-wrap:wrap;gap:6px}
  .ph{font-size:12px;padding:3px 9px;border-radius:14px;border:1px solid var(--line);color:var(--mut)}
  .ph.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-decoration:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease}
  .btn:hover{background:#21262d;border-color:var(--accent);color:#fff}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:#6a42b0}
  .actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}.tiles{grid-column:auto;grid-template-columns:repeat(2,1fr)}.actions{margin-left:0;width:100%;margin-top:8px}}
</style>
</head>
<body>
<header>
  <span class="dot"></span><h1>NightTrace</h1>
  <span class="mut" id="meta">connecting…</span>
  <span class="mut" id="runState"></span>
  <div class="actions">
    <button id="runBtn" class="btn btn-primary" onclick="startRun()" title="Scan the currently calibrated scope.yaml (preempts a running scan)">Run scan</button>
    <button id="stopBtn" class="btn" onclick="stopRun()" disabled title="Abort the current scan">Stop</button>
    <a href="/scope-editor" class="btn" title="Calibrate what the agents may touch (scope.yaml)">Edit scope</a>
    <a href="/discover" class="btn" title="Find hosts on the local WiFi/LAN and build a scope">Discover hosts</a>
    <a href="/report?format=html" target="_blank" class="btn" title="Open full visual HTML report in a new tab">Report</a>
    <a href="/report?format=md" target="_blank" class="btn" title="View Markdown report">MD</a>
    <a href="/report?format=json" target="_blank" class="btn" title="View raw JSON report">JSON</a>
  </div>
</header>
<div class="wrap">
  <div class="tiles">
    <div class="tile"><b id="t-assets">0</b><span class="mut">assets</span></div>
    <div class="tile hi"><b id="t-confirmed">0</b><span class="mut">confirmed</span></div>
    <div class="tile"><b id="t-suspected">0</b><span class="mut">suspected</span></div>
    <div class="tile"><b id="t-refuted">0</b><span class="mut">refuted</span></div>
    <div class="tile ok"><b id="t-stray">0</b><span class="mut">stray probes</span></div>
  </div>

  <div class="panel" style="grid-column:1/3">
    <h2>PTES phase progress</h2>
    <div class="phases" id="phases"></div>
  </div>

  <div class="panel" style="grid-column:1/3">
    <h2>Threat-model hypotheses <span id="hyp-count" class="mut" style="text-transform:none;letter-spacing:0;font-weight:400"></span></h2>
    <div id="hyps"><span class="mut">none yet — formulated as signals appear</span></div>
  </div>

  <div class="panel">
    <h2>Agent activity (live)</h2>
    <div class="feed" id="feed"></div>
  </div>

  <div class="panel">
    <h2>Confirmed findings</h2>
    <div id="findings"><span class="mut">none yet</span></div>
    <h2 style="margin-top:14px">Attack path</h2>
    <div class="chain" id="chain"><span class="mut">not assembled yet</span></div>
  </div>
</div>

<script>
const PHASES = [["pre_engagement","Pre-engage"],["intelligence_gathering","Recon"],
  ["threat_modeling","Threat model"],["vulnerability_analysis","Vuln analysis"],
  ["exploitation","Exploit"],["post_exploitation","Post-exploit"],["reporting","Report"]];
let lastId = 0;
const seenPhases = new Set();
const feed = document.getElementById('feed');

function phaseBar(){
  document.getElementById('phases').innerHTML = PHASES.map(([k,l])=>
    `<span class="ph ${seenPhases.has(k)?'active':''}">${l}</span>`).join('');
}
phaseBar();

async function j(u){ try{const r=await fetch(u); return await r.json();}catch(e){return null;} }

async function pollEvents(){
  const d = await j('/events?since='+lastId);
  if(d && d.events){
    for(const e of d.events){
      seenPhases.add(e.ptes);
      const cls = e.level==='warn'?'warn':(e.level==='error'?'err':'');
      const div = document.createElement('div');
      div.className='ev';
      div.innerHTML = `<span class="ag">${e.agent}</span> <span class="${cls}">${escapeHtml(e.message)}</span>`;
      feed.appendChild(div);
    }
    if(d.events.length){ lastId = d.last_id; feed.scrollTop = feed.scrollHeight; phaseBar(); }
  }
}

async function pollState(){
  const t = await j('/targets');
  if(t && t.stats){
    set('t-assets',t.stats.assets); set('t-confirmed',t.stats.confirmed);
    set('t-suspected',t.stats.suspected); set('t-refuted',t.stats.refuted);
  }
  const h = await j('/healthz');
  if(h) document.getElementById('meta').textContent = `${h.engagement} · tier ${h.tier}`;
  const f = await j('/findings?status=Confirmed');
  if(f && f.findings){
    const stray = await j('/report');
    if(stray && stray.scope_safety) set('t-stray', stray.scope_safety.stray_probe_attempts||0);
    document.getElementById('findings').innerHTML = f.findings.length ? f.findings.map(x=>
      `<div class="f ${x.severity}"><span class="t">${escapeHtml(x.title)}</span>
       <span class="badge">${x.severity.toUpperCase()}</span>
       <div class="m">${x.surface} · ${x.asset_host||''}${x.asset_port?(':'+x.asset_port):''}</div></div>`).join('')
      : '<span class="mut">none yet</span>';
  }
  const hy = await j('/hypotheses');
  if(hy && hy.formulated){
    document.getElementById('hyp-count').textContent =
      hy.formulated.length ? `— ${hy.formulated.filter(h=>h.validated).length}/${hy.formulated.length} validated` : '';
    document.getElementById('hyps').innerHTML = hy.formulated.length ? hy.formulated.map(h=>
      `<div class="hyp ${h.validated?'val':''}">
         <span class="st">${h.validated?'VALIDATED':'formulated'}</span>
         <span class="t">${escapeHtml(h.title)}</span>
         <div class="m">${escapeHtml(h.target||'')} · confidence ${Math.round((h.confidence||0)*100)}% · priority +${h.priority_boost||0}</div>
         <div class="m">${escapeHtml(h.rationale||'')}</div>
       </div>`).join('') : '<span class="mut">none yet — formulated as signals appear</span>';
  }
  const ap = await j('/attack-path');
  if(ap && ap.paths && ap.paths.length){
    const p = ap.paths[0];
    const nodes = [p.steps[0].from, ...p.steps.map(s=>s.to)];
    document.getElementById('chain').innerHTML = nodes.map(n=>
      `<span class="node ${n.startsWith('flag:')||n==='external'?'flag':''}">${escapeHtml(n)}</span>`).join(' → ');
  }
}
function set(id,v){ document.getElementById(id).textContent = v; }
function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// --- run control: scan whatever is calibrated in scope.yaml, from the UI ---
let runBusy = false;   // suppress status polling while a start/stop request is mid-flight

function resetView(){
  lastId = 0; feed.innerHTML = ''; seenPhases.clear(); phaseBar();
  ['t-assets','t-confirmed','t-suspected','t-refuted','t-stray'].forEach(id=>set(id,0));
  document.getElementById('findings').innerHTML = '<span class="mut">none yet</span>';
  document.getElementById('hyps').innerHTML = '<span class="mut">none yet — formulated as signals appear</span>';
  document.getElementById('chain').innerHTML = '<span class="mut">not assembled yet</span>';
}

async function startRun(){
  const btn = document.getElementById('runBtn');
  runBusy = true;
  btn.disabled = true; btn.textContent = 'Working…';
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('runState').textContent = '· starting…';
  try{
    const r = await fetch('/run', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    const d = await r.json();
    if(!r.ok){
      document.getElementById('runState').textContent = '· ' + (d.error || 'could not start run');
      return;
    }
    resetView();   // new run uses a fresh blackboard — clear the old one from view
  }catch(e){
    document.getElementById('runState').textContent = '· run error: ' + e.message;
  }finally{
    runBusy = false;
  }
}

async function stopRun(){
  const stop = document.getElementById('stopBtn');
  runBusy = true;
  stop.disabled = true;
  document.getElementById('runState').textContent = '· stopping…';
  try{ await fetch('/run/stop', {method:'POST'}); }
  catch(e){}
  finally{ runBusy = false; }
}

async function pollRun(){
  if(runBusy) return;
  const s = await j('/run/status');
  if(!s) return;
  const btn = document.getElementById('runBtn');
  const stop = document.getElementById('stopBtn');
  const rs = document.getElementById('runState');
  if(s.running){
    btn.disabled = false; btn.textContent = 'Re-scan';   // enabled: Re-scan preempts
    stop.disabled = false;
    rs.textContent = '· scanning' + (s.scope_path ? ' '+s.scope_path.split(/[\\\/]/).pop() : '') + '…';
  }else{
    btn.disabled = false;
    btn.textContent = (s.status==='idle') ? 'Run scan' : 'Re-scan';
    stop.disabled = true;
    rs.textContent = s.status==='done'      ? '· run complete'
                   : s.status==='cancelled' ? '· run stopped'
                   : s.status==='error'     ? '· run error: ' + (s.error||'')
                   : '· idle — calibrate a scope and press Run';
  }
}

pollEvents(); pollState(); pollRun();
setInterval(pollEvents, 1000);
setInterval(pollState, 2000);
setInterval(pollRun, 1500);
</script>
</body>
</html>
